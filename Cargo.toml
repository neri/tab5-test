# Pure byte-in/value-out components are workspace members rather than modules
# of this binary so they can be built for the host and tested with `cargo
# test`. This package cannot: `main.rs` and everything under it is RISC-V.
[workspace]
members = ["bot-protocol", "browser", "font", "spki", "time"]

[package]
name = "tab5-hello-world"
version = "0.2.0"
edition = "2024"
publish = false

[features]
# Compiles the SPKI pins for the test fixtures (`tools/pins/fixture_pins.txt`)
# into the image, so that `tls-fixture.invalid` can be reached as a pinned
# host. Never for a release: the matching private keys are in `tools/tls/`,
# and `tools/pins/generate.py --check-release` fails on an image that has
# these pins in it.
tls-fixture-pins = []

[dependencies]
# FAT12/16/32 (and, later, exFAT) parsing. Like `smoltcp` below, this is a
# fully specified on-disk format rather than a hardware layer, which is where
# this repository's "implement it yourself" rule stops applying. The candidate
# comparison behind this choice is in `docs/FILESYSTEM_PLAN.md`.
# `default-features = false` drops `std`, which would pull in chrono and a
# clock this target does not have; `src/fs/clock.rs` supplies the RTC instead.
# `write` is on: the RAM root, SD and USB Mass Storage all take writes.
# Whether a particular volume does is a mount mode, not a build feature
# (`docs/FILESYSTEM.md`).
# 2.2.0 is a floor, not a preference. `FileWriter::new_append` in 2.1.0
# positions the writer at offset 0 of the last cluster when the file's length
# is an exact multiple of the cluster size, so an append overwrites that
# cluster instead of allocating a new one. The RAM disk formats with 512-byte
# clusters, which makes every 4 KiB append hit it; `fswritetest /tmp` catches
# it at the first byte of the overwritten cluster.
hadris-fat = { version = "2.2.0", default-features = false, features = [
    "read",
    "write",
    "lfn",
    "sync",
    "alloc",
    # exFAT is an explicitly unstable preview in this crate, and is mounted
    # read-only here for that reason among others -- see `docs/FILESYSTEM.md`.
    "unstable-exfat",
] }
hadris-io = { version = "2.2.0", default-features = false, features = ["sync"] }
embedded-io = { version = "0.7", default-features = false }
linked_list_allocator = "0.10.6"
# Generic RISC-V startup: unlike esp-riscv-rt's current ESP32-P4 support,
# this does not invoke ECO5-only ROM functions before Rust reaches `main`.
riscv-rt = "0.18"
# The protocol stack itself is not hand-written: ARP/IPv4/ICMP/UDP/DHCP/TCP are
# fully specified by RFCs and observable from outside, which is where this
# repository's "implement the hardware layer yourself" rule stops applying.
# `default-features = false` is mandatory: the defaults pull in `std` and the
# host-only raw-socket/tuntap phy backends.
smoltcp = { version = "0.14", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-dhcpv4",
    "socket-udp",
    "socket-icmp",
    "socket-tcp",
    "socket-dns",
    # smoltcp's `build.rs` reads these as configuration, not as code switches,
    # and both default to 1. Three servers is what DHCP can hand over
    # (`MAX_DNS_SERVER_COUNT`), so a smaller list would silently throw away the
    # redundancy the network offered; four results let a round-robin name show
    # more than its first address.
    "dns-max-server-count-3",
    "dns-max-result-count-4",
    "auto-icmp-echo-reply",
] }
# The 16 pixel bitmap font: glyph data plus the one advance-width lookup that
# the renderer and the browser's layout both measure with. A workspace member
# for the same reason as `tab5-browser` below -- lookup and width are pure
# code, and `cargo test` builds them for the host. `docs/FONT_MIGRATION_PLAN.md`
# covers where the data comes from.
tab5-font = { path = "font" }
# The browser's URL, HTML and document code. A workspace member rather than
# a module because it is the one part of the firmware that can be tested off
# the board; see the `[workspace]` note above.
tab5-browser = { path = "browser" }
# Calendar arithmetic, Unix time and fixed-offset time zones. The RX8130CE
# holds UTC (`docs/RTC.md`); this is what turns that into the Unix second a
# certificate check would use and the JST reading a person reads, and it is a
# workspace member so that both directions have host tests.
tab5-time = { path = "time" }
# The CSPRNG `src/entropy.rs` seeds from the SAR ADC noise source. ChaCha20
# is a fully specified construction with published test vectors, which is
# where this repository's "implement it yourself" rule stops applying for the
# same reason it does for smoltcp -- and a stream cipher written here would be
# a stream cipher with no test vectors behind it. `rand_core` is the trait
# the TLS library asks its randomness for.
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
# TLS 1.3 client. Like smoltcp, this is a fully specified wire protocol
# rather than a hardware layer -- and unlike a hardware layer, a TLS stack
# written here would be one whose mistakes nobody else has already found.
# `docs/TLS_PLAN.md` records the comparison behind this choice and the gates
# it had to pass. `default-features = false` drops `std`, `log` and tokio;
# `rsa` (which needs `alloc`) is what makes RSA-PSS `CertificateVerify`
# checkable. `rustpki` is deliberately off: `src/net/tls.rs` brings its own
# verifier, because the library's would need a chain and a clock this does
# not have.
embedded-tls = { version = "0.19", default-features = false, features = [
    "alloc",
    "rsa",
] }
embedded-io-async = { version = "0.7", default-features = false }
# The signature and digest work `src/net/tls.rs`'s verifier does itself.
# `embedded-tls` does not re-export these, and a verifier that cannot name
# its own primitives cannot be written outside the library.
sha2 = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "sha256",
] }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
# The DER walk that finds a leaf certificate's public key. A workspace member
# because it is the one part of the TLS path that parses input an attacker
# chooses, and `cargo test` builds it for the host.
tab5-spki = { path = "spki" }
# USB Mass Storage BOT's CSW parser and length/residue consistency rules are
# pure byte-in/value-out code. Keeping them in a no_std workspace member makes
# malformed status wrappers host-testable without compiling the RISC-V HCD.
tab5-bot-protocol = { path = "bot-protocol" }

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
