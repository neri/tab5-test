[tasks.run]
description = "Run the application"
run = "cargo run --release"

[tasks.clean]
confirm = "Are you sure?"
description = "Clean the build artifacts"
run = "cargo clean"

[tasks.update]
description = "Update the dependencies"
run = "cargo update"

[tasks.test]
description = "Run the browser crate's host-side tests"
# Explicitly host-targeted: `.cargo/config.toml` points the default target at
# `riscv32imafc-unknown-none-elf`, where there is no test harness to run. Only
# `tab5-browser` builds for the host; the firmware package does not.
run = "cargo test -p tab5-browser --target x86_64-unknown-linux-gnu"

# [tasks.doc]
# description = "Generate documentation"
# run = "cargo doc"

[tasks.build]
description = "Build the application"
run = "cargo build --release"

[tasks.monitor]
description = "Run a monitor for the application"
run = "python3 tools/monitor.py"

[tasks.dev]
description = "Run the application in development mode"
run = "mise run run && mise run monitor"
