[build]
target = "riscv32imafc-unknown-none-elf"

[target.riscv32imafc-unknown-none-elf]
# Tab5's reset/boot circuitry can stay in download mode when a serial monitor
# toggles DTR/RTS. Flash first; start a no-reset monitor separately after a
# short physical reset/power cycle.
# `partitions.csv` is flashed at the standard ESP-IDF offset (0x8000). The
# firmware image is placed in its `factory` app partition, rather than relying
# on espflash's implicit/default partition layout.
runner = "espflash flash --chip esp32p4 --flash-size 16mb --after no-reset --partition-table partitions.csv --partition-table-offset 0x8000 --target-app-partition factory"
rustflags = [
  "-C", "link-arg=-Tmemory.x",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--emit-relocs",
  "-C", "force-frame-pointers",
]
