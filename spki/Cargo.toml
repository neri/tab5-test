[package]
name = "tab5-spki"
version = "0.1.0"
edition = "2024"
publish = false

# No dependencies. Walking a DER structure is byte-in/value-out code, which
# is what lets `cargo test` build this crate for the host while the firmware
# only ever builds for RISC-V -- the same reason `tab5-browser`, `tab5-font`
# and `tab5-time` are workspace members rather than modules of the binary.
# The certificates under `data/` are OpenSSL's output, kept so that the tests
# check agreement with a real X.509 implementation; `docs/NETWORK.md` says
# how they were made.
[dependencies]
